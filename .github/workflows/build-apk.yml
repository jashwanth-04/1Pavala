name: Build 1Pavala Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v1.3.0)'
        required: false
        type: string
        default: 'v1.3.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Setup Gradle Build Tool & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Stage APK Files
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/1Pavala.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1Pavala-Android-APK
          path: build-output/1Pavala.apk
          retention-days: 30

      - name: Publish GitHub Release (on tag or manual release trigger)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: 1Pavala ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build-output/1Pavala.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
