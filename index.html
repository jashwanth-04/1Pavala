<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#214B30" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS & Android PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="1Pavala" />
    <meta name="application-name" content="1Pavala" />
    <meta name="format-detection" content="telephone=no" />
    
    <title>1Pavala — Private Personal Expense Tracker &amp; Monthly Budgeting</title>
    <meta name="description" content="1Pavala is a private, manual expense tracker and budgeting app that runs completely on your device. Zero bank linking, zero ads, and 100% offline." />
    
    <!-- Google Fonts: Manrope (Primary) & Geist Mono (Data/Monospace) per B1 Typography Guidelines -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Instant theme initialization to prevent flash and lag -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('1pavala_theme_v1');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#000000');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F2F2F7] dark:bg-[#000000] text-[#1C1C1E] dark:text-white font-sans antialiased min-h-screen selection:bg-brand-500 selection:text-white transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
